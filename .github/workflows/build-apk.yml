name: Build NEXXO Enterprise Network APK

on:
  workflow_dispatch:
  push:
    paths:
      - "nexxo-cloud-build-ready.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract NEXXO project
        run: |
          rm -rf nexxo-project
          mkdir nexxo-project
          unzip -q nexxo-cloud-build-ready.zip -d nexxo-project

      - name: Find project root
        run: |
          echo "Searching for package.json..."
          find nexxo-project -name package.json -type f -print

      - name: Build web project
        working-directory: nexxo-project
        run: |
          npm install
          npm run build

      - name: Sync Capacitor Android
        working-directory: nexxo-project
        run: |
          npx cap sync android

      - name: Configure Android SDK
        working-directory: nexxo-project
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        working-directory: nexxo-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXXO-Enterprise-Network-debug-APK
          path: nexxo-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
